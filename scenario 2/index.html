<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Banner Text Changer</title>

<!-- Bootstrap CSS -->
<link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">

<!-- Bootstrap Icons -->
<link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<style>
    body {
        background-color: #f8f9fa;
    }

    .banner-card {
        max-width: 650px;
    }

    .banner-icon {
        font-size: 3rem;
    }

    #banner {
        min-height: 70px;
    }
</style>

</head>
<body>
 
<nav class="navbar navbar-dark bg-dark">
    <div class="container">

        <a class="navbar-brand fw-bold" href="../index.html">
            <i class="bi bi-code-slash me-2"></i>
            JavaScript Lab
        </a>

        <a href="../index.html" class="btn btn-outline-light btn-sm">
            <i class="bi bi-house me-1"></i>
            Home
        </a>

    </div>
</nav>

<main class="container py-5">

    <div class="text-center mb-4">
        <span class="badge text-bg-secondary mb-3">
            Scenario 2
        </span>

        <h1 class="fw-bold">
            Dynamic Banner Text Changer
        </h1>

        <p class="text-secondary">
            Click the button to update the banner text.
        </p>
    </div>

    <div class="card banner-card border-0 shadow-sm mx-auto">
        <div class="card-body p-5 text-center">

            <div class="banner-icon text-secondary mb-3">
                <i class="bi bi-megaphone"></i>
            </div>

            <h2 id="banner" class="fw-bold mb-4">
                Welcome banner
            </h2>

            <button id="updateBtn"
                    type="button"
                    class="btn btn-secondary btn-lg">
                <i class="bi bi-pencil-square me-2"></i>
                Update Text
            </button>

        </div>
    </div>

</main>

<footer class="bg-dark text-white py-4">
    <div class="container text-center">
        
        <p class="mb-0 text-white-50 small">
            <small>
                © 2026 All Rights Reserved.<br>
            </small>
        </p>

    </div>
</footer>

<script src="app.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="widt=device-width, initial-scale=1.0">
    <title>Digital Tally Counter</title>

<!-- Bootstrap CSS -->
<link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">

<!-- Bootstrap Icons -->
<link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<style>
    body {
        background-color: #f8f9fa;
    }

    .counter-card {
        max-width: 500px;
    }

    .count-display {
        font-size: 5rem;
        font-weight: 700;
        line-height: 1;
    }

    .counter-icon {
        font-size: 3rem;
    }
</style>

</head>
  <body>
<nav class="navbar navbar-dark bg-dark">
    <div class="container">

        <a class="navbar-brand fw-bold" href="../index.html">
            <i class="bi bi-code-slash me-2"></i>
            JavaScript Lab
        </a>

        <a href="../index.html" class="btn btn-outline-light btn-sm">
            <i class="bi bi-house me-1"></i>
            Home
        </a>

    </div>
</nav>

<main class="container py-5">

    <div class="text-center mb-4">
        <span class="badge text-bg-primary mb-3">
            Scenario 1
        </span>

        <h1 class="fw-bold">
            Digital Tally Counter
        </h1>

        <p class="text-secondary">
            Use the buttons below to control the counter.
        </p>
    </div>

    <div class="card counter-card border-0 shadow-sm mx-auto">
        <div class="card-body p-5 text-center">

            <div class="counter-icon text-primary mb-3">
                <i class="bi bi-123"></i>
            </div>

            <p class="text-secondary mb-2">
                Current Count
            </p>

            <h2 id="count" class="count-display mb-4">
                0
            </h2>

            <div class="d-grid gap-2">

                <button id="incrementBtn"
                        type="button"
                        class="btn btn-primary btn-lg">
                    <i class="bi bi-plus-lg me-2"></i>
                    Increment
                </button>

                <button id="resetBtn"
                        type="button"
                        class="btn btn-outline-secondary btn-lg">
                    <i class="bi bi-arrow-counterclockwise me-2"></i>
                    Reset
                </button>

            </div>

        </div>
    </div>

</main>

<footer class="bg-dark text-white py-4">
    <div class="container text-center">
        
        <p class="mb-0 text-white-50 small">
            <small>
                © 2026 All Rights Reserved.<br>
            </small>
        </p>

    </div>
</footer>

<script src="app.js"></script>

</body>
</html>
